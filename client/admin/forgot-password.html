      /* Admin forgot-password styles — consistent with login/register pages */
      .admin-forgot__wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8f8f8;
        padding: 40px 0;
      }
      .admin-forgot__card {
        max-width: 480px;
        margin: 0 auto;
        background: var(--rr-common-white);
        border-radius: 12px;
        padding: 50px 45px;
        box-shadow: 0px 10px 40px rgba(21, 24, 27, 0.08);
        border: 1px solid rgba(21, 24, 27, 0.06);
      }
      @media (max-width: 575px) {
        .admin-forgot__card {
          padding: 30px 20px;
        }
      }
      .admin-forgot__card .rr-btn {
        width: 100%;
        justify-content: center;
      }
      .admin-forgot__card .get-in-touch__form-input {
        margin-bottom: 20px;
      }
      .admin-forgot__card .get-in-touch__form-input input {
        background: #f8f8f8;
        border: 1px solid transparent;
      }
      .admin-forgot__card .get-in-touch__form-input input:focus {
        border-color: var(--rr-theme-primary);
        background: #fff;
      }
      .admin-forgot__logo {
        text-align: center;
        margin-bottom: 30px;
      }
      .admin-forgot__logo img {
        max-width: 120px;
      }
      .admin-forgot__title {
        text-align: center;
        margin-bottom: 8px;
      }
      .admin-forgot__subtitle {
        text-align: center;
        font-family: var(--rr-ff-robo);
        font-size: 16px;
        color: var(--rr-text-body);
        margin-bottom: 30px;
      }
      .admin-forgot__back-link {
        text-align: center;
        margin-top: 25px;
        font-family: var(--rr-ff-robo);
        font-size: 16px;
        color: var(--rr-text-body);
      }
      .admin-forgot__back-link a {
        color: var(--rr-theme-primary);
        font-weight: 600;
      }
      .admin-forgot__back-link a:hover {
        color: var(--rr-heading-primary);
        text-decoration: underline;
      }
      /* Status message */
      .status {
        font-family: var(--rr-ff-robo);
        font-size: 14px;
        padding: 10px 16px;
        border-radius: 8px;
        margin-top: 12px;
        display: none;
      }
      .status.visible {

        color: #166534;
      }
      .status.error {
        background: #fee2e2;
        color: #991b1b;
      }

    <style>
      /* Toast notification styles */
      .toast-container {
        position: fixed; top: 24px; right: 24px; z-index: 99999;
        display: flex; flex-direction: column; gap: 12px;
        pointer-events: none; max-width: 100%;
      }
      .toast {
        pointer-events: auto; display: flex; align-items: flex-start; gap: 14px;
        background: #1a1d23; border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px; padding: 16px 20px; min-width: 320px; max-width: 440px;
        box-shadow: 0 12px 48px rgba(0,0,0,0.35);
        animation: toastSlideIn 0.35s cubic-bezier(0.16,1,0.3,1);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .toast.removing { opacity: 0; transform: translateX(60px); }
      .toast__icon { flex: 0 0 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 2px; }
      .toast--success .toast__icon { background: rgba(34,197,94,0.15); color: #22c55e; }
      .toast--error .toast__icon { background: rgba(239,68,68,0.15); color: #ef4444; }
      .toast--info .toast__icon { background: rgba(59,130,246,0.15); color: #3b82f6; }
      .toast--warning .toast__icon { background: rgba(234,179,8,0.15); color: #eab308; }
      .toast__body { flex: 1; min-width: 0; }
      .toast__title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 4px; font-family: sans-serif; }
      .toast__message { font-size: 14px; font-weight: 500; line-height: 1.5; color: #f1ead9; font-family: sans-serif; word-wrap: break-word; }
      .toast__close { flex: 0 0 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 16px; padding: 0; border-radius: 4px; }
      .toast__close:hover { color: #fff; }
      @keyframes toastSlideIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
      @media (max-width: 520px) { .toast-container { top: 16px; right: 16px; left: 16px; } .toast { min-width: 0; max-width: 100%; padding: 14px 16px; } }
    </style>

    <script>
      (function () {
        const form = document.getElementById("forgot-password-form");
        const submitBtn = document.getElementById("forgot-submit-btn");
        const statusEl = document.getElementById("status");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value.trim();

          if (!email) {
            // showToast("error", "Please enter your email address.");
            alert("Please enter your email address.");
            return;
          }

          // Hide any previous status
          hideStatus(statusEl);

          // Disable button and show loading state
          submitBtn.disabled = true;
          submitBtn.querySelector(".text-one").textContent =
            "Sending reset link...";
          submitBtn.querySelector(".text-two").textContent =
            "Sending reset link...";

          try {
            const data = await postJSON("/auth/forgot-password", { email });
            // showToast(
            //   "success",
            //   data.message ||
            //     "If an account with that email exists, a reset link has been sent.",
            // );
            alert(
              data.message ||
                "If an account with that email exists, a reset link has been sent.",
            );
            // Clear the form so users don't accidentally re-submit
            form.reset();
          } catch (err) {
            console.error("Forgot password error:", err);
            // showToast("error", err.message);
            alert(err.message);
          } finally {
            submitBtn.disabled = false;
            submitBtn.querySelector(".text-one").textContent =
              "Send Reset Link";
            submitBtn.querySelector(".text-two").textContent =
              "Send Reset Link";
          }
        });
      })();
    </script>
