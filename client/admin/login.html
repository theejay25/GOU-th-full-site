      /* Admin-specific styles */
      .admin-login__card {

        font-size: 16px;
        color: var(--rr-text-body);

      .admin-login__register-link a {

        font-weight: 600;
      }
      .admin-login__register-link a:hover {

      }
      .admin-login__forgot-link {

        margin-bottom: 20px;
        font-family: var(--rr-ff-robo);
        font-size: 14px;
      }
      .admin-login__forgot-link a {

      }
      .admin-login__forgot-link a:hover {
        color: var(--rr-heading-primary);
        text-decoration: underline;
      }
      .admin-login__logo {

      }

      }
      .admin-login__title {

        margin-bottom: 8px;

      .admin-login__subtitle {

        font-family: var(--rr-ff-robo);
        font-size: 16px;
        color: var(--rr-text-body);
        margin-bottom: 30px;
      }
      .password-wrapper {
        position: relative;
      }
      .password-wrapper .toggle-password {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: var(--rr-text-body);
        font-size: 18px;
        background: transparent;
        border: none;
        padding: 0;
        z-index: 2;
      }
      .password-wrapper .toggle-password:hover {

      }
      /* Toast notification styles */
      .toast-container { position: fixed; top: 24px; right: 24px; z-index: 99999; display: flex; flex-direction: column; gap: 12px; pointer-events: none; max-width: 100%; }
      .toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 14px; background: #1a1d23; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 16px 20px; min-width: 320px; max-width: 440px; box-shadow: 0 12px 48px rgba(0,0,0,0.35); animation: toastSlideIn 0.35s cubic-bezier(0.16,1,0.3,1); transition: opacity 0.3s ease, transform 0.3s ease; }
      .toast.removing { opacity: 0; transform: translateX(60px); }
      .toast--success .toast__icon { background: rgba(34,197,94,0.15); color: #22c55e; }
      .toast--error .toast__icon { background: rgba(239,68,68,0.15); color: #ef4444; }
      .toast--info .toast__icon { background: rgba(59,130,246,0.15); color: #3b82f6; }
      .toast--warning .toast__icon { background: rgba(234,179,8,0.15); color: #eab308; }
      .toast__icon { flex: 0 0 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 2px; }
      .toast__body { flex: 1; min-width: 0; }
      .toast__title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 4px; font-family: sans-serif; }
      .toast__message { font-size: 14px; font-weight: 500; line-height: 1.5; color: #f1ead9; font-family: sans-serif; word-wrap: break-word; }
      .toast__close { flex: 0 0 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 16px; padding: 0; border-radius: 4px; }
      .toast__close:hover { color: #fff; }
      @keyframes toastSlideIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
      @media (max-width: 520px) { .toast-container { top: 16px; right: 16px; left: 16px; } .toast { min-width: 0; max-width: 100%; padding: 14px 16px; } }

    <script>
      // ─── Redirect to dashboard if already authenticated ─────────
      (function () {
        const token = localStorage.getItem("accessToken");
        if (token) {
          // Verify token is still valid by checking with the server
          (async function () {
            try {
              const res = await fetch(`${API_BASE}/auth/profile`, {
                headers: { Authorization: `Bearer ${token}` },
              });
              if (res.ok) {
                // Token is valid, redirect to dashboard
                window.location.href = "dashboard.html";
              } else {
                // Token invalid/expired, clean up
                localStorage.removeItem("accessToken");
                localStorage.removeItem("refreshToken");
              }
            } catch (e) {
              // Server unreachable, token might still be valid locally
              // We'll check JWT expiry client-side as a fallback
              try {
                const payload = JSON.parse(atob(token.split(".")[1]));
                if (payload.exp * 1000 > Date.now()) {
                  window.location.href = "dashboard.html";
                } else {
                  localStorage.removeItem("accessToken");
                  localStorage.removeItem("refreshToken");
                }
              } catch (e2) {
                // Malformed token, clean up
                localStorage.removeItem("accessToken");
                localStorage.removeItem("refreshToken");
              }
            }
          })();
        }
      })();

      // Toggle password visibility
      function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector("i");
        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      const form = document.getElementById("login-form");
      const submitBtn = form.querySelector(".rr-btn");
      const statusEl = document.getElementById("status");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.querySelector(".text-one").textContent = "Signing in...";
        submitBtn.querySelector(".text-two").textContent = "Signing in...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("loginPassword").value;

        try {
const data = await postJSON("/auth/login", { email, password });
          // Store tokens for authenticated requests
          localStorage.setItem("accessToken", data.data.accessToken);
          localStorage.setItem("refreshToken", data.data.refreshToken);
          const successMsg = data.message || "Logged in successfully.";
          showToast("success", successMsg);
          alert(successMsg);
          submitBtn.querySelector(".text-one").textContent = "Signed in";
          submitBtn.querySelector(".text-two").textContent = "Signed in";
          // Redirect to dashboard after short delay
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1200);
        } catch (err) {
          showToast("error", err.message);
          alert(err.message);
          submitBtn.disabled = false;
          submitBtn.querySelector(".text-one").textContent = "Sign In";
          submitBtn.querySelector(".text-two").textContent = "Sign In";
        }
      });
    </script>
