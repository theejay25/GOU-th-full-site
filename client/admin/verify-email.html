      /* Toast notification styles */
      .toast-container {
        position: fixed; top: 24px; right: 24px; z-index: 99999;
        display: flex; flex-direction: column; gap: 12px;
        pointer-events: none; max-width: 100%;
      }
      .toast {
        pointer-events: auto; display: flex; align-items: flex-start; gap: 14px;
        background: #1a1d23; border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px; padding: 16px 20px; min-width: 320px; max-width: 440px;
        box-shadow: 0 12px 48px rgba(0,0,0,0.35);
        animation: toastSlideIn 0.35s cubic-bezier(0.16,1,0.3,1);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .toast.removing { opacity: 0; transform: translateX(60px); }
      .toast__icon { flex: 0 0 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 2px; }
      .toast--success .toast__icon { background: rgba(34,197,94,0.15); color: #22c55e; }
      .toast--error .toast__icon { background: rgba(239,68,68,0.15); color: #ef4444; }
      .toast--info .toast__icon { background: rgba(59,130,246,0.15); color: #3b82f6; }
      .toast--warning .toast__icon { background: rgba(234,179,8,0.15); color: #eab308; }
      .toast__body { flex: 1; min-width: 0; }
      .toast__title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 4px; font-family: sans-serif; }
      .toast__message { font-size: 14px; font-weight: 500; line-height: 1.5; color: #f1ead9; font-family: sans-serif; word-wrap: break-word; }
      .toast__close { flex: 0 0 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 16px; padding: 0; border-radius: 4px; }
      .toast__close:hover { color: #fff; }
      @keyframes toastSlideIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
      @media (max-width: 520px) { .toast-container { top: 16px; right: 16px; left: 16px; } .toast { min-width: 0; max-width: 100%; padding: 14px 16px; } }

    <script>
      (function () {
        const checkingView = document.getElementById("checking-view");
        const resultView = document.getElementById("result-view");
        const noTokenView = document.getElementById("no-token-view");
        const statusEl = document.getElementById("status");
        const resultTitle = document.getElementById("result-title");
        const resultLede = document.getElementById("result-lede");
        const resultIcon = document.getElementById("result-icon");
        const ctaBtn = document.getElementById("cta-btn");

        /**
         * Extracts the verification token from the URL.
         * Supports two URL shapes:
         *   /verify-email.html?token=<token>
         *   /verify-email/<token>
         */
        function extractToken() {
          const params = new URLSearchParams(window.location.search);
          if (params.get("token")) return params.get("token");

          const parts = window.location.pathname.split("/").filter(Boolean);
          const last = parts[parts.length - 1];
          if (last && last !== "verify-email.html") return last;

          return null;
        }

        /**
         * Calls the backend GET /api/auth/verify-email/:token endpoint
         * and updates the UI accordingly.
         */
        async function verify(token) {
          checkingView.style.display = "flex";
          resultView.style.display = "none";

          try {
            const data = await getJSON(
              `/auth/verify-email/${encodeURIComponent(token)}`,
            );
            checkingView.style.display = "none";
            resultView.style.display = "block";
            resultIcon.className = "admin-verify__icon success";
            resultIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
            resultTitle.textContent = "Email Verified";
            resultLede.textContent =
              "Your account is active. You can sign in now.";
            ctaBtn.textContent = "Sign In";
            ctaBtn.href = "login.html";
            showStatus(
              statusEl,
              "success",
              data.message || "Email verified successfully.",
            );
          } catch (err) {
            checkingView.style.display = "none";
            resultView.style.display = "block";
            resultIcon.className = "admin-verify__icon error";
            resultIcon.innerHTML = '<i class="fas fa-times-circle"></i>';
            resultTitle.textContent = "Verification Failed";
            resultLede.textContent =
              "This link may have expired or already been used.";
            ctaBtn.textContent = "Back to Sign In";
            ctaBtn.href = "login.html";
            showToast("error", err.message);
          }
        }

        // --- On page load, try to extract and verify the token ---
        const token = extractToken();
        if (token) {
          verify(token);
        } else {
          checkingView.style.display = "none";
          noTokenView.style.display = "block";
        }

        // --- Manual token form handler ---
        document
          .getElementById("manual-form")
          .addEventListener("submit", async function (e) {
            e.preventDefault();
            const manualToken = document
              .getElementById("manual-token")
              .value.trim();
            const manualStatus = document.getElementById("manual-status");
            if (!manualToken) return;

            try {
              const data = await getJSON(
                `/auth/verify-email/${encodeURIComponent(manualToken)}`,
              );
              showStatus(
                manualStatus,
                "success",
                data.message || "Email verified successfully.",
              );
            } catch (err) {
              showToast("error", err.message);
            }
          });
      })();
    </script>
