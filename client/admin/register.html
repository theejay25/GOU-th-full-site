    <style>
      /* Toast notification styles */
      .toast-container {
        position: fixed; top: 24px; right: 24px; z-index: 99999;
        display: flex; flex-direction: column; gap: 12px;
        pointer-events: none; max-width: 100%;
      }
      .toast {
        pointer-events: auto; display: flex; align-items: flex-start; gap: 14px;
        background: #1a1d23; border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px; padding: 16px 20px; min-width: 320px; max-width: 440px;
        box-shadow: 0 12px 48px rgba(0,0,0,0.35);
        animation: toastSlideIn 0.35s cubic-bezier(0.16,1,0.3,1);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .toast.removing { opacity: 0; transform: translateX(60px); }
      .toast__icon { flex: 0 0 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 2px; }
      .toast--success .toast__icon { background: rgba(34,197,94,0.15); color: #22c55e; }
      .toast--error .toast__icon { background: rgba(239,68,68,0.15); color: #ef4444; }
      .toast--info .toast__icon { background: rgba(59,130,246,0.15); color: #3b82f6; }
      .toast--warning .toast__icon { background: rgba(234,179,8,0.15); color: #eab308; }
      .toast__body { flex: 1; min-width: 0; }
      .toast__title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 4px; font-family: sans-serif; }
      .toast__message { font-size: 14px; font-weight: 500; line-height: 1.5; color: #f1ead9; font-family: sans-serif; word-wrap: break-word; }
      .toast__close { flex: 0 0 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 16px; padding: 0; border-radius: 4px; }
      .toast__close:hover { color: #fff; }
      @keyframes toastSlideIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
      @media (max-width: 520px) { .toast-container { top: 16px; right: 16px; left: 16px; } .toast { min-width: 0; max-width: 100%; padding: 14px 16px; } }
    </style>

    <script>
      // ─── Self-contained toast function (works independently of api.js) ───
      function registerToast(type, message) {
        // Create container if not exists
        var c = document.getElementById("toast-container");
        if (!c) {
          c = document.createElement("div");
          c.id = "toast-container";
          c.className = "toast-container";
          document.body.appendChild(c);
        }

        var t = document.createElement("div");
        t.className = "toast toast--" + type;

        var icon = "";
        if (type === "success") icon = '<i class="fas fa-check"></i>';
        else if (type === "error") icon = '<i class="fas fa-times"></i>';
        else icon = '<i class="fas fa-info"></i>';

        // Escape HTML to prevent XSS
        var msg = String(message || "").replace(/&/g, "&" + "amp;").replace(/</g, "&" + "lt;").replace(/>/g, "&" + "gt;").replace(/"/g, "&" + "quot;").replace(/'/g, "&#" + "039;");

        t.innerHTML =
          '<div class="toast__icon">' + icon + '</div>' +
          '<div class="toast__body"><div class="toast__message">' + msg + '</div></div>' +
          '<button class="toast__close" onclick="(function(el){el.classList.add(\'removing\');setTimeout(function(){if(el.parentNode)el.remove()},300)})(this.closest(\'.toast\'))"><i class="fas fa-times"></i></button>';

        c.appendChild(t);

        var ad = setTimeout(function () {
          if (t.parentNode) {
            t.classList.add("removing");
            setTimeout(function () { if (t.parentNode) t.remove(); }, 300);
          }
        }, 4500);

        t.addEventListener("mouseenter", function () { clearTimeout(ad); });
        t.addEventListener("mouseleave", function () {
          if (!t.classList.contains("removing")) {
            setTimeout(function () {
              if (t.parentNode && !t.classList.contains("removing")) {
                t.classList.add("removing");
                setTimeout(function () { if (t.parentNode) t.remove(); }, 300);
              }
            }, 4500);
          }
        });
      }

      // ─── Override the api.js showToast to use our local version ───
      var originalShowToast = window.showToast;
      window.showToast = registerToast;

      // Toggle password visibility
      function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector("i");
        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      (function () {
        const form = document.getElementById("adminRegisterForm");
        const statusEl = document.getElementById("status");
        const submitBtn = document.getElementById("reg-submit-btn");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const fullname = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("regPassword").value;
          const confirmPassword =
            document.getElementById("regConfirmPassword").value;

          // Client-side validation
          if (!fullname || !email || !password || !confirmPassword) {
            showToast("error", "Please fill in all required fields.");
            return;
          }

          if (password.length < 6) {
            showToast("error", "Password must be at least 6 characters long.");
            return;
          }

          if (password !== confirmPassword) {
            showToast("error", "Passwords do not match!");
            return;
          }

          // Hide any previous status
          hideStatus(statusEl);

          // Disable button and show loading state (preserve the .btn-wrap spans)
          submitBtn.disabled = true;
          submitBtn.querySelector(".text-one").textContent =
            "Creating account...";
          submitBtn.querySelector(".text-two").textContent =
            "Creating account...";

          try {
            const data = await postJSON("/auth/register", {
              name: fullname,
              email,
              password,
            });

const successMsg =
              data.message ||
              "Account created! Please check your email to verify your account.";
            showToast("success", successMsg);
            alert(successMsg);
            // Clear the form and keep user on the page so they can check email
            form.reset();
          } catch (err) {
            console.error("Register error:", err);
            const msg =
              err && err.message
                ? err.message
                : "Registration failed. Please try again.";
            showToast("error", msg);
            alert(msg);
          } finally {
            submitBtn.disabled = false;
            submitBtn.querySelector(".text-one").textContent = "Create Account";
            submitBtn.querySelector(".text-two").textContent = "Create Account";
          }
        });
      })();
    </script>
